services:
  - type: web
    name: adlis
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adlis-db
          property: connectionString
      - key: RENDER
        value: true

databases:
  - name: adlis-db
    plan: free