<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./assets/img/logo_englet.png">
    <title>Mon Profil - Adlis</title>
</head>
<body class = "profile-body">
    <div class="index-header">
        <div class="index-brand">
            <a href="./index.html" class="brand-link">
                <img src="./assets/img/logo_englet.png" alt="Adlis Logo" class="brand-logo">
                <span class="brand-name">ADLIS</span>
            </a>
        </div>
        <button class="admin-logout-btn">Déconnexion</button>
    </div>
    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-pic-container">
                <img src="./assets/img/profil-de-lutilisateur.png" alt="Photo de profil" class="profile-pic">
                <div class="add-avatar-btn" title="Choisir un avatar">
                    <i class="fa-solid fa-plus"></i>
                </div>
            </div>
            <h1>Mon Profil</h1>
        </div>

        <div class="profile-info">
            <h3>Informations personnelles</h3>
            <div class="info-row">
                <p><strong>Nom :</strong>Nadjib</p>
                <i class="fa-solid fa-pen edit-icon"></i>
            </div>
            <div class="info-row">
                <p><strong>Prénom :</strong>Yani</p>
                <i class="fa-solid fa-pen edit-icon"></i>
            </div>
            <div class="info-row">
                <p><strong>Âge :</strong> 34ans</p>
                <i class="fa-solid fa-pen edit-icon"></i>
            </div>
        </div>

        <div class="purchase-history">
            <h3>Historique d'achats</h3>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Livre</th>
                        <th>Prix</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>12/04/2026</td>
                        <td>L'Alchimiste</td>
                        <td>1200 DA</td>
                        <td><span class="status delivered">Livré</span></td>
                    </tr>
                    <tr>
                        <td>20/04/2026</td>
                        <td>think again</td>
                        <td>2500 DA</td>
                        <td><span class="status pending">En cours</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body> 
</html>
